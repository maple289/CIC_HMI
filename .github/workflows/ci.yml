name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / Windows
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q src scripts tests
      - name: Run automated tests
        run: python -m pytest -q --junitxml=tmp/test-results.xml
      - name: Check register inventory is current
        run: |
          python scripts/generate_register_tables.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- Docs/REGISTER_TABLES.md
      - name: Run desktop environment smoke test
        run: python scripts/check_environment.py --check
      - name: Run single-analyzer monitoring GUI smoke test
        run: python scripts/run_hmi.py --smoke-test --data-dir tmp/monitoring-smoke
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm build_windows.spec
      - name: Verify packaged executable
        run: |
          $app = Start-Process -FilePath "$PWD/dist/PREVEX-HMI/PREVEX-HMI.exe" -ArgumentList @('--smoke-test', '--data-dir', "$PWD/tmp/packaged-smoke") -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
          $report = Get-Content -Raw tmp/packaged-smoke/smoke-report.json | ConvertFrom-Json
          if ($report.result -ne 'PASS') { throw 'Packaged monitoring smoke test failed' }
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: |
            tmp/test-results.xml
            tmp/environment-check/
            tmp/monitoring-smoke/*.png
            tmp/monitoring-smoke/smoke-report.json
            tmp/packaged-smoke/smoke-report.json
          retention-days: 14
      - name: Upload Windows monitoring preview
        uses: actions/upload-artifact@v4
        with:
          name: PREVEX-HMI-Windows-preview
          path: dist/PREVEX-HMI/
          retention-days: 14
